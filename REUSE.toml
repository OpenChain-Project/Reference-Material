    "Guides/Community/Reusing-Software/en/including_license_info.html",
    "Guides/Community/Reusing-Software/en/including_license_info.rst",
    "Open-Source-Policy/Community/Contribution-Policy-Template/BestpracticesTemplate.md",
]
